universe_mapper:
  universe_yaml: "config/universe.yaml"
  beta_lookback_sessions: 60

index_alignment:
  short_bias_lookback_5m: 20
  medium_bias_lookback_15m: 10
  score_deltas:
    ALIGNED_STRONG: 1.0
    ALIGNED: 0.5
    NEUTRAL: 0.0
    CONTRA: -0.8
    CONTRA_STRONG: "VETO"
  override_money_tier_with_sweep:
    enabled: true
    score_delta: 0.3
  high_beta_threshold: 1.3
  low_beta_threshold: 0.7

sector:
  lookback_minutes: 15
  leaders_quartile: 0.25
  laggards_quartile: 0.25
  score_deltas:
    aligned_leader_long: 0.6
    aligned_laggard_short: 0.6
    contra_leader: -0.5
    contra_laggard: -0.5
  rotation_window_min: 30
  rotation_bonus: 0.3
  peer_breadth_peers_n: 5
  peer_breadth_score:
    four_five: 0.4
    three_five: 0.2
    two_or_less_contra: -0.2

rs:
  horizons_minutes: [15, 60, "session"]
  super_strong_thresholds: {session_pct: 85, short_pct: 75}
  strong_threshold_pct: 70
  weak_threshold_pct: 30
  super_weak_thresholds: {session_pct: 15, short_pct: 25}
  score_deltas:
    super_strong_aligned: 0.8
    strong_aligned: 0.5
    weak_contra_to_candidate: -0.5
    super_weak_contra_to_candidate: -1.0
    super_weak_contra_require_tier: "ELITE"
  rs_momentum_bonus: 0.3
  rs_momentum_penalty: -0.3

breadth:
  bullish_broad: {adr: 1.8, up_vol: 1.5, pct_above_vwap: 65}
  bullish:       {adr: 1.3, up_vol: 1.2}
  bearish:       {adr: 0.8, down_vol: 1.2}
  bearish_broad: {adr: 0.55, down_vol: 1.5, pct_above_vwap: 35}
  score_deltas:
    aligned_broad: 0.4
    aligned_regular: 0.2
    opposes_broad: -0.6
    divergence_favour: 0.4
    divergence_against: -0.3

cross_asset:
  usdinr_session_threshold_pct: 0.3
  crude_session_threshold_pct: 0.3  
  commodities_threshold_pct: 0.4
  vix_session_threshold_pct: 5.0
  sgx_premium_threshold_pct: 0.3
  sgx_applies_until_ist: "09:30:00"
  score_deltas:
    usdinr_aligned: 0.5
    crude_aviation_long_on_up: -0.6
    crude_omc_long_on_up: 0.3
    crude_paint_long_on_up: -0.3
    crude_upstream_long_on_up: 0.4
    commodities_aligned: 0.4
    vix_up_favours_short: 0.3
    sgx_lean: 0.3

global_risk:
  compute_time_ist: "09:14:00"
  risk_on_broad:
    min_indices_up: 4
    min_pct: 0.3
  risk_on:
    min_indices_up: 3
    min_pct: 0.2
  risk_off:
    min_indices_down: 3
    min_pct: 0.2
  risk_off_broad:
    min_indices_up: 4
    min_pct: 0.3
  fii_heavy_threshold_cr: 2000
  score_deltas_window_a:
    risk_on_broad_aligned: 0.5
    risk_on_aligned: 0.2
    risk_off_contra: -0.3
    risk_off_broad_contra: -0.7
    risk_off_broad_require_tier: "ELITE"
  post_window_a_weight: 0.3

aggregator:
  raw_delta_cap: [-2.5, 2.0]
  regime_weights:
    TRENDING_HIGH_VOL: 1.2
    TRENDING_LOW_VOL: 1.0
    MEAN_REVERTING: 0.8
  setup_weights:
    TRAP_FADE: 0.7
    TREND_CONTINUATION: 1.2
    BREAKOUT: 1.1
    OB_MITIGATION: 1.0
  window_weights:
    OPENING_BURST: 1.0
    pre_lunch: 1.0
    lunch_dead: 0.6
    afternoon_resume: 1.0
