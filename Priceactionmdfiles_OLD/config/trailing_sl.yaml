# ===============================================================
# Trailing Stop-Loss + Graduated Partial Profit Booking
# ===============================================================

enabled: true

# -- Partial Exit Schedule (FRACTIONAL TARGETS) --------------
# Based on Sector Base Target (assuming Target = 2 * SL distance)
# T1 = 1.0x Base Target = 2.0R
# T2 = 1.5x Base Target = 3.0R
# T3 = 2.0x Base Target = 4.0R
# T4 = 2.5x Base Target = 5.0R
# T5 = 3.0x Base Target = 6.0R
#
partial_exits:
  - r_multiple: 2.0     # Target 1 (Base Avg)
    exit_pct: 20         
  - r_multiple: 3.0     # Target 2 (1.5x Base)
    exit_pct: 20
  - r_multiple: 4.0     # Target 3 (2.0x Base)
    exit_pct: 20
  - r_multiple: 5.0     # Target 4 (2.5x Base)
    exit_pct: 20
  - r_multiple: 6.0     # Target 5 (3.0x Base)
    exit_pct: 20         # trade fully closed

# -- Minimum Quantity Rules ----------------------------------
min_remaining_qty: 1
round_qty_to: 1          

# -- Paper Mode Settings ------------------------------------
paper_mode:
  use_high_low_for_exits: true
  same_bar_conflict: "conservative"
